<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Market — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f1e; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #10182b; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { display: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Night Market, spot the difference: two near-identical pictures side by side; click every difference before the clock runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="selftest"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
